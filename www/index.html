<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ec"><title>Moments Bridge</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2ec;color:#282823;font:16px/1.5 system-ui,-apple-system,sans-serif}.card{width:min(90vw,380px);padding:30px 24px;background:#fffefa;border:1px solid #e7e1d7;border-radius:24px;text-align:center;box-shadow:0 12px 40px #33281712}.mark{width:60px;height:60px;border-radius:18px;background:#ece5da;margin:0 auto 16px;display:grid;place-items:center;font:30px Georgia,serif;color:#8d7961}.card h1{font:26px Georgia,serif;margin:0 0 8px}.card p{color:#817c72;margin:0}.spinner{width:26px;height:26px;border:3px solid #e7e1d7;border-top-color:#8d7961;border-radius:50%;animation:r .8s linear infinite;margin:22px auto 0}.hidden{display:none}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><main class="card"><div class="mark">m.</div><h1>Moments Bridge</h1><p id="status">Waiting for a shared story image…</p><div class="spinner" id="spinner"></div></main>
<script src="bridge-config.js"></script><script>
const statusEl=document.querySelector('#status'),spinner=document.querySelector('#spinner');
function say(message,loading=false){statusEl.textContent=message;spinner.classList.toggle('hidden',!loading)}
function base64Of(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
let handled=false;
async function handleUrl(raw){if(handled||!raw)return;let url;try{url=new URL(raw)}catch{return}if(url.protocol!=='momentsbridge:'||url.hostname!=='share')return;const token=url.searchParams.get('token');if(!token)return;handled=true;say('Preparing your story for Instagram…',true);try{const imageResponse=await fetch(window.MOMENTS_SITE_URL+'/api/bridge-image?token='+encodeURIComponent(token),{cache:'no-store'});if(!imageResponse.ok)throw new Error('The temporary image expired. Return to Moments Studio and try again.');const image=await imageResponse.blob();const imageBase64=await base64Of(image);const native=window.Capacitor?.Plugins?.InstagramStories;if(!native)throw new Error('Instagram sharing is not available in this bridge build.');await native.share({imageBase64,mimeType:'image/jpeg'});say('Instagram Story is ready. Review it and tap Share in Instagram.')}catch(error){say(error.message||'Could not open Instagram Story. Return to Moments Studio and try again.')}}
(async()=>{const app=window.Capacitor?.Plugins?.App;if(!app){say('Open this helper from the installed Moments Bridge app.');return}app.addListener('appUrlOpen',event=>handleUrl(event.url));try{const launch=await app.getLaunchUrl();if(launch?.url)await handleUrl(launch.url)}catch{}})();
</script></body></html>
